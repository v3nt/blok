:217,"Dynamic Reformer":184,"Just Ride":160,"Lift":138,"Speed Fiends":75,"Hot Vinyasa Yoga":67,"Sweat X":66,"Hot Hatha Yoga":56,"Brazilian Jiu Jitsu":48,"Fundamental Reformer Pilates":48,"Hot Mat Pilates":45,"Metaburn":43,"Pulse":42,"Tower Pilates":37,"LGA":35,"HYROX Run":34,"Mat Pilates":31,"Formula 3":27,"Vinyasa Yoga":27,"The Method":23,"Hot Yin Yoga":22,"Wattbike":22,"Boxing":20,"Hatha Yoga":19,"The WOD":16,"Mat Pilates Fundamentals":14,"Sound Bath":13,"Core":12,"HYROX Train":12,"Muay Thai Fundamentals":8,"Candlelit Yin Yoga":7,"Kettlebells":7,"Yin Yoga":7,"HYROX":6,"Yoga Workshop":6,"Afterburner":4,"Muay Thai Padwork (Intermediate)":4,"Swim":4,"Candlelit Sound Bath":3,"Dance Fit":3,"Boxing Fundamentals":2,"Force":2,"Hot Flexibility Flow":2,"Hot Rocket Yoga":2,"Rocket Yoga":2,"Run Club":2,"Triathlon Swim":2,"Candlelit Vinyasa Yoga":1,"Self":1}},VENUES=["T"],ORDER={"T":["Traditional Reformer Pilates","Dynamic Reformer","Just Ride","Lift","Speed Fiends","Hot Vinyasa Yoga","Sweat X","Hot Hatha Yoga","Brazilian Jiu Jitsu","Fundamental Reformer Pilates","Hot Mat Pilates","Metaburn","Pulse","Tower Pilates","LGA","HYROX Run","Mat Pilates","Formula 3","Vinyasa Yoga","The Method","Hot Yin Yoga","Wattbike","Boxing","Hatha Yoga","The WOD","Mat Pilates Fundamentals","Sound Bath","Core","HYROX Train","Muay Thai Fundamentals","Candlelit Yin Yoga","Kettlebells","Yin Yoga","HYROX","Yoga Workshop","Afterburner","Muay Thai Padwork (Intermediate)","Swim","Candlelit Sound Bath","Dance Fit","Boxing Fundamentals","Force","Hot Flexibility Flow","Hot Rocket Yoga","Rocket Yoga","Run Club","Triathlon Swim","Candlelit Vinyasa Yoga","Self"]},DEFAULT_FAVS=[],DESC={"Afterburner":"A high-intensity class that pushes EPOC (excess post-oxygen consumption) so that your body keeps working even after the session has finished.","Boxing":"Take your boxing skills to the next level. You will learn not only how to punch the pads, but also how to hold them. This is a more advanced class which will incorporate footwork, head movement, and complex combinations. Members are kindly requested to bring their own boxing gloves and wraps (these can be purchased at Concierge).","Boxing Fundamentals":"Learn boxing fundamentals. Beginners will be taught the correct stance, the precise technique for punches, and effective boxing movements. Advanced boxers will improve their form and progress their technique. Members are kindly requested to bring their own boxing gloves and wraps (these can be purchased at Concierge).","Brazilian Jiu Jitsu":"Learning the fundamental positions, movements and techniques of Brazilian Jiu Jitsu. A grappling based martial art which uses takedowns, throws, pins and submissions to combat your opponent. This class is ideal for those new to Jiu Jitsu and grappling.","Candlelit Sound Bath":"Lose yourself in deep relaxation and meditation. A unique soundscape of gongs, crystal bowls and percussion instruments will leave you feeling calm and rejuvenated.","Candlelit Vinyasa Yoga":"Each class is unique, guided by the teacher’s individual style and training, offering a steady, but faster-paced flow.","Candlelit Yin Yoga":"Slow and meditative, Yin Yoga promotes flexibility, relaxation and energy flow by applying gentle, sustained pressure.","Core":"A strong and functional core is fundamental for all training. This class uses full body movements in multiple planes to fully engage your core building strength, stability and balance as well as shaping your abdominals.","Dynamic Reformer":"Minimal rest, maximum results. Increase the tempo in this advanced reformer class.","Force":"A music driven barbell and dumbbell class designed to fatigue the whole body through higher repetitions creating muscular endurance. A great class for those new to weights or experienced lifters who want to feel the burn in a high energy but supported environment.","Formula 3":"This is the Formula to get you fit, fast. A competitive, high intensity circuit with 3 targeted blocks, for a full spectrum workout. First, cardio on Concept2 rowing machines; Second, strength with kettlebells and dumbbells; Finally, athletic power and speed with bodyweight exercises. Get fit in 3… 2… 1","Fundamental Reformer Pilates":"No experience necessary. Whether you’re a Reformer beginner, healing from an injury, or want a slower class, start building your foundation here.","HYROX":"Build your race-day engine. This class combines high-volume running, erg work, and functional strength to boost both aerobic endurance and anaerobic power. Whether you’re chasing faster 1K splits or tackling sleds, Engine gives you the cardiovascular grit to go the distance.","HYROX Run":"Simulate the demands of fitness racing, combining muscular fatigue with interval running on the treadmill. Strength and power-based movements replace recovery between intervals to compromise your next run and improve cardiovascular endurance.","HYROX Train":"Develop your functional fitness to become the ultimate hybrid athlete and train to take part in a Hyrox fitness race event. Learn and improve exercise techniques to make every rep count. Attend up to 12 weeks of our progressive programming to get race ready.","Hatha Yoga":"New to yoga? This is the class for you. Move at a slower pace to focus on each posture and alignment using pranayama – or conscious breathing exercises.","Hot Hatha Yoga":"New to yoga? This is the class for you. Move at a slower pace to focus on each posture and alignment using pranayama – or conscious breathing exercises.","Hot Mat Pilates":"A slower-paced class that emphasises precise instruction, with a strong focus on proper alignment and posture improvement.","Hot Rocket Yoga":"Fast and strong. Rooted in Ashtanga Vinyasa yoga, this challenging and playful practice incorporates inversions, arm balances, back-bends and standing balances to powerful, upbeat music. Suitable for enthusiastic beginners and experienced yoga practitioners alike.","Hot Vinyasa Yoga":"Each class is unique, guided by the teacher’s individual style and training, offering a steady, but faster-paced flow.","Hot Yin Yoga":"Slow and meditative, Yin Yoga promotes flexibility, relaxation and energy flow by applying gentle, sustained pressure.","Just Ride":"Switch off. Just Ride. Tempo cardio intervals with climbs and sprints. Lose yourself in the music.","Kettlebells":"A dynamic full-body workout designed to boost core strength and enhance muscular endurance. A variety of kettlebell exercises target every major muscle group, helping you build power while shredding body fat.","LGA":"Legs, Glutes and Abs. Working some of the largest muscles in the body to create a high calorie burn. Expect a combination of strength and high intensity explosive exercises, aimed at increasing strength and flexibility to torch fat and sculpt the lower body.","Lift":"Create a strong, athletic and powerful body using progressively heavier weights under the careful instruction of your trainer.","Mat Pilates":"A slower-paced class that emphasises precise instruction, with a strong focus on proper alignment and posture improvement.","Mat Pilates Fundamentals":"A slower-paced class that emphasises precise instruction, with a strong focus on proper alignment and posture improvement.","Metaburn":"A pyramid style, full body metabolic conditioning workout. Strengthen your body using resistance exercises interspersed with high intensity plyometric moves, building intensity throughout the workout.","Muay Thai Fundamentals":"Building on the Muay Thai fundamentals, work with a partner to increase power by developing your timing and accuracy. Get closer to your combat community with the confidence of your partner spurring you on. Under coach supervision, learn how to hold pads correctly, communicate and execute combinations using the “Art of Eight Limbs” – punches, kicks, knees and elbows.","Muay Thai Padwork (Intermediate)":"Building on the Muay Thai fundamentals, work with a partner to increase power by developing your timing and accuracy. Get closer to your combat community with the confidence of your partner spurring you on. Under coach supervision, learn how to hold pads correctly, communicate and execute combinations using the “Art of Eight Limbs” – punches, kicks, knees and elbows.","Pulse":"Set to the beat of the music, this low-impact barre workout uses ballet and Pilates-inspired isometric strength training techniques.","Rocket Yoga":"Fast and strong. Rooted in Ashtanga Vinyasa yoga, this challenging and playful practice incorporates inversions, arm balances, back-bends and standing balances to powerful, upbeat music. Suitable for enthusiastic beginners and experienced yoga practitioners alike.","Run Club":"Develop your functional fitness to become the ultimate hybrid athlete and train to take part in a Hyrox fitness race event. Learn and improve exercise techniques to make every rep count. Attend up to 12 weeks of our progressive programming to get race ready.","Sound Bath":"Lose yourself in deep relaxation and meditation. A unique soundscape of gongs, crystal bowls and percussion instruments will leave you feeling calm and rejuvenated.","Speed Fiends":"Unlock your full running potential with focused interval training on the treadmill. Tailored to your individual pace and level, this 45-minute cardio-intensive class has an expert coach on hand offer motivation and guidance on your running form.","Sweat X":"Sweat with a purpose as you split the time equally between running and strength on and off the treadmill. Transform your training as you torch calories, build endurance and unleash your strength with this high intensity focused class set to an incredible playlist. Suitable for all levels. Pick up a headset from the instructor before the class starts.","Swim":"A front crawl focused session with varying skills and drills, concentrating on: the Catch, Push, Pull and recovery elements of your stroke. Our expert coaches will enhance your overall technique for a faster and more efficient swim style.","The Method":"A barre-based full-body workout, set to energising music. Suitable to all, including newbies and pre and post-natal members.","The WOD":"Your Workout of the Day. Inspired by cross training, expect “EMOMs” and “AMRAPs” as standard and be prepared to dig deep and push hard. The WOD combines effective high intensity training and strength work in an encouraging and motivating environment.","Tower Pilates":"Traditional Tower Pilates classes are an authentic blend of classical Pilates exercises and contemporary variations.","Traditional Reformer Pilates":"Using spring tension to support and challenge you, expect to stretch, strengthen and tone in this full-body workout.","Triathlon Swim":"A coached, water based session focusing on technique, swim specific fitness and open water skills to enhance an athletes triathlon or open water performance.","Vinyasa Yoga":"Each class is unique, guided by the teacher’s individual style and training, offering a steady, but faster-paced flow.","Wattbike":"Our Wattbike class replicates a real ride feel and delivers an unrivalled experience. With targeted effective programming and the ability to analyse your technique, its no wonder it is the choice of champions and endorsed by British cycling. Whether you are a seasoned athlete or complete beginner, maximise your performance and redefine your training.","Yin Yoga":"Slow and meditative, Yin Yoga promotes flexibility, relaxation and energy flow by applying gentle, sustained pressure."},STUDIO_URL={"Islington":"https://www.thirdspace.london/timetable/","Moorgate":"https://www.thirdspace.london/timetable/","City":"https://www.thirdspace.london/timetable/"},LOCS=["Islington","Moorgate","City"];
