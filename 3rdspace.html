draw();
// The filters were sticky, so they held the top of the window all the way down
// a 2000-row schedule. Let them scroll away like anything else, and leave a
// slim strip in their place that expands over the page when you need them.
(function(){
 var bar=document.getElementById('filters'),mb=document.getElementById('minibar'),
     mbt=document.getElementById('mbt'),mbc=document.getElementById('mbc'),
     fs=document.getElementById('fscrim'),mq=window.matchMedia('(max-width:640px)');
 if(!bar||!mb)return;
 function open(){return bar.classList.contains('float')}
 function float(on){
  bar.classList.toggle('float',on);
  bar.style.top=on?(mb.offsetHeight+'px'):'';
  fs.classList.toggle('on',on);
  mbt.setAttribute('aria-expanded',on?'true':'false');
  mbc.textContent=on?'\u25b4':'\u25be';
  if(on)mb.classList.add('on');
 }
 function update(){
  if(mq.matches){float(false);mb.classList.remove('on');return;}   // phones use the hamburger
  if(open()){mb.classList.add('on');return;}
  mb.classList.toggle('on', bar.getBoundingClientRect().bottom<=0);
 }
 mbt.addEventListener('click',function(){float(!open())});
 fs.addEventListener('click',function(){float(false)});
 document.addEventListener('keydown',function(e){if(e.key==='Escape'&&open())float(false)});
 window.addEventListener('scroll',update,{passive:true});
 window.addEventListener('resize',update);
 update();
})();
// Mobile: one hamburger holds everything that is not the schedule itself.
// The controls are MOVED, not duplicated - a second copy of a checkbox is a
// second source of truth, and they drift. Every listener above still applies
// because these are the same nodes.
(function(){
 var mq=window.matchMedia('(max-width:640px)');
 var drawer=document.getElementById('drawer'),scrim=document.getElementById('scrim'),
     dbody=document.getElementById('dbody'),btn=document.getElementById('mnu'),
     dclose=document.getElementById('dclose');
 if(!drawer||!btn)return;
 var blocks=['.sub','#lg','#booked','.bar'].map(function(sel){
  var el=document.querySelector(sel);
  return el?{el:el,parent:el.parentNode,next:el.nextSibling}:null;
 }).filter(Boolean);
 var inMenu=false;
 function toMenu(){if(inMenu)return;blocks.forEach(function(b){dbody.appendChild(b.el)});inMenu=true;}
 function toPage(){if(!inMenu)return;blocks.forEach(function(b){b.parent.insertBefore(b.el,b.next)});inMenu=false;}
 function show(on){
  drawer.classList.toggle('open',on);scrim.classList.toggle('on',on);
  btn.setAttribute('aria-expanded',on?'true':'false');
  document.body.classList.toggle('locked',on);
 }
 function apply(){ if(mq.matches){toMenu();} else {show(false);toPage();} }
 btn.addEventListener('click',function(){show(!drawer.classList.contains('open'))});
 scrim.addEventListener('click',function(){show(false)});
 dclose.addEventListener('click',function(){show(false)});
 document.addEventListener('keydown',function(e){if(e.key==='Escape')show(false)});
 if(mq.addEventListener)mq.addEventListener('change',apply);else if(mq.addListener)mq.addListener(apply);
 apply();
})();
// Jump links: the M T W ... strip and each booked class scroll the schedule
// to that day / that class, clear of whatever header is stuck to the top.
var DSHOWN;
function jumpTo(el){
 if(!el)return false;
 var dr=document.getElementById('drawer');
 if(dr&&dr.classList.contains('open')){var c=document.getElementById('dclose');if(c)c.click();}
 var off=6,tp=document.getElementById('topbar'),mb=document.getElementById('minibar');
 if(tp&&getComputedStyle(tp).display!=='none')off+=tp.offsetHeight;
 else if(mb){var was=mb.classList.contains('on');mb.classList.add('on');off+=mb.offsetHeight;if(!was)mb.classList.remove('on');}
 // Instant, then one correction: the sticky filter strip appears once the
 // filters scroll away and shifts the table by its own height, so a single
 // (or smooth) scroll lands a strip-height off. The yellow flash marks it.
 window.scrollTo(0,Math.max(0,el.getBoundingClientRect().top+window.pageYOffset-off));
 var fix=function(){var dy=el.getBoundingClientRect().top-off;if(Math.abs(dy)>2)window.scrollBy(0,dy)};
 requestAnimationFrame(function(){requestAnimationFrame(fix)});setTimeout(fix,120);
 el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit');
 setTimeout(function(){el.classList.remove('hit')},1800);
 return true;
}
function paintDays(){
 var n=new Date(),p=function(x){return (x<10?'0':'')+x};
 var today=n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate()),bkd={};
 D.forEach(function(r){if(r[7]==='booked')bkd[r[0]]=1;else if(r[7]==='waitlist'&&!bkd[r[0]])bkd[r[0]]=2});
 var h='';
 (DSHOWN||[]).forEach(function(iso,i){
  var d=new Date(iso+'T00:00:00'),c=[];
  if(i&&d.getDay()===1)c.push('wk');
  if(iso===today)c.push('today');
  if(bkd[iso]===1)c.push('bk');else if(bkd[iso]===2)c.push('wl');
  h+='<a href="#d-'+iso+'" data-d="'+iso+'" class="'+c.join(' ')+'" title="'+dl(iso)+(bkd[iso]===1?' — you have a booking':bkd[iso]===2?' — you are on a waitlist':'')+'">'
   +'<span>'+'MTWTFSS'.charAt((d.getDay()+6)%7)+'</span><b>'+d.getDate()+'</b></a>';
 });
 [].forEach.call(document.querySelectorAll('.dnav'),function(nv){nv.innerHTML=h});
}
document.addEventListener('click',function(e){
 var t=e.target;if(!t||!t.closest)return;
 var a=t.closest('.dnav a');
 if(a){e.preventDefault();jumpTo(document.getElementById('d-'+a.getAttribute('data-d')));return;}
 var b=t.closest('#booked a.bgo');
 if(b){
  e.preventDefault();
  var k=b.getAttribute('data-k'),row=null;
  [].some.call(document.querySelectorAll('#tb tr[data-k]'),function(tr){if(tr.getAttribute('data-k')===k){row=tr;return true}return false});
  if(!jumpTo(row)){
   var note=b.querySelector('.bh');
   if(!note){note=document.createElement('span');note.className='bh';b.appendChild(note)}
   note.textContent='hidden by your filters';
   setTimeout(function(){note.textContent=''},2500);
  }
 }
});
