.bar{background:#fff;border-bottom:1px solid var(--bd);padding:10px 18px;font-size:13.5px}

#mshown{color:#55555f;font-size:12.5px;font-variant-numeric:tabular-nums}
.bar.float{position:fixed;left:0;right:0;z-index:16;max-height:72vh;overflow:auto;box-shadow:0 12px 34px rgba(0,0,0,.20)}
#fscrim{display:none;position:fixed;inset:0;z-index:14;background:rgba(0,0,0,.16)}
#fscrim.on{display:block}
.bar .top{display:flex;flex-wrap:wrap;gap:9px 18px;align-items:center}
.bar label{display:inline-flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap}
.bar .sep{width:1px;height:18px;background:var(--bd)}
.bar .n{color:#87878f;font-size:12px}
#shown{color:#55555f;font-size:12.5px;font-variant-numeric:tabular-nums}
.grp{margin-top:9px;padding-top:8px;border-top:1px dashed var(--bd)}

.col:hover{color:#16161a}
.row.collapsed .chip{display:none}
.all{display:inline-flex;gap:4px;align-items:center;cursor:pointer;font-size:11.5px;color:#6b6b76;border-right:1px solid var(--bd);padding-right:10px;margin-right:2px;white-space:nowrap}
.grp h3{margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6b6b76}

.grp .row.locs label{display:inline-flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap}
.grp .row.fav{display:none;padding:5px 8px 6px;margin-bottom:6px;background:#fffaeb;border:1px solid #f0dfa8;border-radius:8px}
.grp .row.fav.on{display:flex}
.grp .row.fav::before{content:"★";color:#e8a90c;font-size:12px;align-self:center;margin-right:2px}
.chip{display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.star{border:0;background:none;cursor:pointer;font-size:14px;line-height:1;padding:0 2px;color:#c9c9d1}
.star[aria-pressed="true"]{color:#e8a90c}
.rstar{opacity:0;transition:opacity .12s;vertical-align:middle;margin-left:4px}
tr:hover .rstar,.rstar[aria-pressed="true"],.rstar:focus{opacity:1}
@media(hover:none){.rstar{opacity:1}}
#reset{border:1px solid var(--bd);background:#f4f4f6;border-radius:7px;padding:5px 11px;font:inherit;font-size:12.5px;cursor:pointer}

thead{display:none}
#tb tr.day td{padding:7px 11px}
#tb tr:not(.day){display:grid;grid-template-columns:60px minmax(0,1fr) auto;
 gap:2px 9px;align-items:start;padding:9px 11px;border-bottom:1px solid #f0f0f3}

#drawer #booked li{display:block}
#drawer #booked .bt{display:block}
#drawer #booked .bl{display:block;color:#16161a}
body.locked{overflow:hidden}
}

Rocket Yoga","Run Club | Run The Thames","Triathlon Swim","Self"]},DEFAULT_FAVS=["T|Kettlebells"],DESC={"Afterburner":"A high-intensity class that pushes EPOC (excess post-oxygen consumption) so that your body keeps working even after the session has finished.","Boxing":"Take your boxing skills to the next level. You will learn not only how to punch the pads, but also how to hold them. This is a more advanced class which will incorporate footwork, head movement, and complex combinations. Members are kindly requested to bring their own boxing gloves and wraps (these can be purchased at Concierge).","Boxing Fundamentals":"Learn boxing fundamentals. Beginners will be taught the correct stance, the precise technique for punches, and effective boxing movements. Advanced boxers will improve their form and progress their technique. Members are kindly requested to bring their own boxing gloves and wraps (these can be purchased at Concierge).","Brazilian Jiu Jitsu":"Learning the fundamental positions, movements and techniques of Brazilian Jiu Jitsu. A grappling based martial art which uses takedowns, throws, pins and submissions to combat your opponent. This class is ideal for those new to Jiu Jitsu and grappling.","Candlelit Sound Bath":"Lose yourself in deep relaxation and meditation. A unique soundscape of gongs, crystal bowls and percussion instruments will leave you feeling calm and rejuvenated.","Candlelit Yin Yoga":"Slow and meditative, Yin Yoga promotes flexibility, relaxation and energy flow by applying gentle, sustained pressure.","Core":"A strong and functional core is fundamental for all training. This class uses full body movements in multiple planes to fully engage your core building strength, stability and balance as well as shaping your abdominals.","Dynamic Reformer":"Minimal rest, maximum results. Increase the tempo in this advanced reformer class.","Force":"A music driven barbell and dumbbell class designed to fatigue the whole body through higher repetitions creating muscular endurance. A great class for those new to weights or experienced lifters who want to feel the burn in a high energy but supported environment.","Formula 3":"This is the Formula to get you fit, fast. A competitive, high intensity circuit with 3 targeted blocks, for a full spectrum workout. First, cardio on Concept2 rowing machines; Second, strength with kettlebells and dumbbells; Finally, athletic power and speed with bodyweight exercises. Get fit in 3… 2… 1","Fundamental Reformer Pilates":"No experience necessary. Whether you’re a Reformer beginner, healing from an injury, or want a slower class, start building your foundation here.","HYROX":"Build your race-day engine. This class combines high-volume running, erg work, and functional strength to boost both aerobic endurance and anaerobic power. Whether you’re chasing faster 1K splits or tackling sleds, Engine gives you the cardiovascular grit to go the distance.","HYROX Run":"Simulate the demands of fitness racing, combining muscular fatigue with interval running on the treadmill. Strength and power-based movements replace recovery between intervals to compromise your next run and improve cardiovascular endurance.","HYROX Train":"Develop your functional fitness to become the ultimate hybrid athlete and train to take part in a Hyrox fitness race event. Learn and improve exercise techniques to make every rep count. Attend up to 12 weeks of our progressive programming to get race ready.","Hatha Yoga":"New to yoga? This is the class for you. Move at a slower pace to focus on each posture and alignment using pranayama – or conscious breathing exercises.","Hot Hatha Yoga":"New to yoga? This is the class for you. Move at a slower pace to focus on each posture and alignment using pranayama – or conscious breathing exercises.","Hot Mat Pilates":"A slower-paced class that emphasises precise instruction, with a strong focus on proper alignment and posture improvement.","Hot Rocket Yoga":"Fast and strong. Rooted in Ashtanga Vinyasa yoga, this challenging and playful practice incorporates inversions, arm balances, back-bends and standing balances to powerful, upbeat music. Suitable for enthusiastic beginners and experienced yoga practitioners alike.","Hot Vinyasa Yoga":"Each class is unique, guided by the teacher’s individual style and training, offering a steady, but faster-paced flow.","Hot Yin Yoga":"Slow and meditative, Yin Yoga promotes flexibility, relaxation and energy flow by applying gentle, sustained pressure.","Just Ride":"Switch off. Just Ride. Tempo cardio intervals with climbs and sprints. Lose yourself in the music.","Kettlebells":"A dynamic full-body workout designed to boost core strength and enhance muscular endurance. A variety of kettlebell exercises target every major muscle group, helping you build power while shredding body fat.","LGA":"Legs, Glutes and Abs. Working some of the largest muscles in the body to create a high calorie burn. Expect a combination of strength and high intensity explosive exercises, aimed at increasing strength and flexibility to torch fat and sculpt the lower body.","Lift":"Create a strong, athletic and powerful body using progressively heavier weights under the careful instruction of your trainer.","Mat Pilates":"A slower-paced class that emphasises precise instruction, with a strong focus on proper alignment and posture improvement.","Mat Pilates Fundamentals":"A slower-paced class that emphasises precise instruction, with a strong focus on proper alignment and posture improvement.","Metaburn":"A pyramid style, full body metabolic conditioning workout. Strengthen your body using resistance exercises interspersed with high intensity plyometric moves, building intensity throughout the workout.","Muay Thai Fundamentals":"Building on the Muay Thai fundamentals, work with a partner to increase power by developing your timing and accuracy. Get closer to your combat community with the confidence of your partner spurring you on. Under coach supervision, learn how to hold pads correctly, communicate and execute combinations using the “Art of Eight Limbs” – punches, kicks, knees and elbows.","Muay Thai Padwork (Intermediate)":"Building on the Muay Thai fundamentals, work with a partner to increase power by developing your timing and accuracy. Get closer to your combat community with the confidence of your partner spurring you on. Under coach supervision, learn how to hold pads correctly, communicate and execute combinations using the “Art of Eight Limbs” – punches, kicks, knees and elbows.","Pulse":"Set to the beat of the music, this low-impact barre workout uses ballet and Pilates-inspired isometric strength training techniques.","Rocket Yoga":"Fast and strong. Rooted in Ashtanga Vinyasa yoga, this challenging and playful practice incorporates inversions, arm balances, back-bends and standing balances to powerful, upbeat music. Suitable for enthusiastic beginners and experienced yoga practitioners alike.","Run Club":"Develop your functional fitness to become the ultimate hybrid athlete and train to take part in a Hyrox fitness race event. Learn and improve exercise techniques to make every rep count. Attend up to 12 weeks of our progressive programming to get race ready.","Run Club | Run The Thames":"Develop your functional fitness to become the ultimate hybrid athlete and train to take part in a Hyrox fitness race event. Learn and improve exercise techniques to make every rep count. Attend up to 12 weeks of our progressive programming to get race ready.","Sound Bath":"Lose yourself in deep relaxation and meditation. A unique soundscape of gongs, crystal bowls and percussion instruments will leave you feeling calm and rejuvenated.","Speed Fiends":"Unlock your full running potential with focused interval training on the treadmill. Tailored to your individual pace and level, this 45-minute cardio-intensive class has an expert coach on hand offer motivation and guidance on your running form.","Sweat X":"Sweat with a purpose as you split the time equally between running and strength on and off the treadmill. Transform your training as you torch calories, build endurance and unleash your strength with this high intensity focused class set to an incredible playlist. Suitable for all levels. Pick up a headset from the instructor before the class starts.","Swim":"A front crawl focused session with varying skills and drills, concentrating on: the Catch, Push, Pull and recovery elements of your stroke. Our expert coaches will enhance your overall technique for a faster and more efficient swim style.","The Method":"A barre-based full-body workout, set to energising music. Suitable to all, including newbies and pre and post-natal members.","The WOD":"Your Workout of the Day. Inspired by cross training, expect “EMOMs” and “AMRAPs” as standard and be prepared to dig deep and push hard. The WOD combines effective high intensity training and strength work in an encouraging and motivating environment.","Tower Pilates":"Traditional Tower Pilates classes are an authentic blend of classical Pilates exercises and contemporary variations.","Traditional Reformer Pilates":"Using spring tension to support and challenge you, expect to stretch, strengthen and tone in this full-body workout.","Triathlon Swim":"A coached, water based session focusing on technique, swim specific fitness and open water skills to enhance an athletes triathlon or open water performance.","Vinyasa Yoga":"Each class is unique, guided by the teacher’s individual style and training, offering a steady, but faster-paced flow.","Wattbike":"Our Wattbike class replicates a real ride feel and delivers an unrivalled experience. With targeted effective programming and the ability to analyse your technique, its no wonder it is the choice of champions and endorsed by British cycling. Whether you are a seasoned athlete or complete beginner, maximise your performance and redefine your training.","Yin Yoga":"Slow and meditative, Yin Yoga promotes flexibility, relaxation and energy flow by applying gentle, sustained pressure."},STUDIO_URL={"Islington":"https://www.thirdspace.london/timetable/","Moorgate":"https://www.thirdspace.london/timetable/","City":"https://www.thirdspace.london/timetable/"},LOCS=["Islington","Moorgate","City"];

function dl(iso){var d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}

// A native title= tooltip takes about a second to appear, renders in the OS
// style and is easy to miss - which is why these read as "not working".
// Show a real one straight away, on hover and on keyboard focus.
(function(){
 var tip=document.getElementById('tip'), cur=null;
 function show(el,x,y){
  var d=el.getAttribute('data-desc'); if(!d)return;
  tip.innerHTML='';
  var h=document.createElement('b');h.textContent=el.textContent;
  tip.appendChild(h);tip.appendChild(document.createTextNode(d));
  tip.style.display='block';
  var w=tip.offsetWidth, ht=tip.offsetHeight;
  tip.style.left=Math.min(Math.max(8,x+14), window.innerWidth-w-8)+'px';
  var top=y+18; if(top+ht>window.innerHeight-8) top=Math.max(8,y-ht-14);
  tip.style.top=top+'px'; cur=el;
 }
 function hide(){tip.style.display='none';cur=null;}
 function pill(e){return e.target&&e.target.closest?e.target.closest('.pill[data-desc]'):null;}
 document.addEventListener('mouseover',function(e){var el=pill(e);if(el)show(el,e.clientX,e.clientY);else if(cur)hide();});
 document.addEventListener('mousemove',function(e){var el=pill(e);if(cur&&el===cur)show(cur,e.clientX,e.clientY);});
 document.addEventListener('focusin',function(e){var el=pill(e);if(el){var r=el.getBoundingClientRect();show(el,r.left,r.bottom-8);}});
 document.addEventListener('focusout',hide);
 // Don't hide on scroll: the pointer is usually still over the pill (trackpad
 // scrolling, or a programmatic scrollIntoView), and hiding leaves the tooltip
 // stuck off until the mouse moves. Reposition to the element instead.
 document.addEventListener('scroll',function(){
  if(!cur)return;
  if(!document.body.contains(cur)){hide();return;}
  var r=cur.getBoundingClientRect();
  if(r.bottom<0||r.top>window.innerHeight){hide();return;}
  show(cur,r.left,r.bottom-8);
 },true);
 document.addEventListener('keydown',function(e){if(e.key==='Escape')hide();});
})();
function draw(){
 var tb=document.getElementById('tb');tb.innerHTML='';
 var cur='',shown=0,cnt={};
 D.forEach(function(r){

  // a booked class is not bookable, so it vanished from the schedule,

 });

 var ms=document.getElementById('mshown');if(ms)ms.textContent=shown+' of '+D.length+' shown';
 var lab=[['bookable','Bookable'],['full','Full'],['soon','Not yet open'],['booked','Booked'],['closed','Closed'],['unknown','Status unknown'],['open','In the timetable']];

// The filters were sticky, so they held the top of the window all the way down
// a 2000-row schedule. Let them scroll away like anything else, and leave a
// slim strip in their place that expands over the page when you need them.
(function(){
 var bar=document.getElementById('filters'),mb=document.getElementById('minibar'),
     mbt=document.getElementById('mbt'),mbc=document.getElementById('mbc'),
     fs=document.getElementById('fscrim'),mq=window.matchMedia('(max-width:640px)');
 if(!bar||!mb)return;
 function open(){return bar.classList.contains('float')}

  bar.classList.toggle('float',on);

// Mobile: one hamburger holds everything that is not the schedule itself.

(function(){

 var drawer=document.getElementById('drawer'),scrim=document.getElementById('scrim'),
     dbody=document.getElementById('dbody'),btn=document.getElementById('mnu'),
     dclose=document.getElementById('dclose');

  var el=document.querySelector(sel);

 }).filter(Boolean);
