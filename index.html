M":"You train independently. A space to train your way. Open Gym gives you full access to our purpose-built strength area featuring premium bars, plates, squat racks, benches, cable machines, rigs and other strength-specific machinery needed to explore your own programme. Please note this is an unsupervised session, with no trainers in the space while you’re training. If you’re new to strength equipment we recommend starting with a Trainer Support session or an Essentials class to build confidence first.","REFORMER PILATES L2":"Designed for those with some prior Reformer experience, this class blends strength, mobility and control at a dynamic pace. It’s perfect for regular practice and steady progression. Building on the foundations from Reformer L1, you’ll move at a faster pace, combining classical and dynamic movements for a fun, creative and challenging full-body workout. If you’re completely new to Reformer we recommend attending at least 3 Reformer Pilates classes first.","HOT + COLD":"HOT + COLD combines ancient sauna and cold water therapy traditions with a modern, integrated approach. Designed to build resilience, boost performance, and regulate your nervous system, this offering invites you to explore the transformative power of temperature contrasts. In this self guided session you have the autonomy to create a structure that is best suited for your body.","BARRE":"Improve posture, increase flexibility and define muscles with Barre. Barre is a method of training inspired by ballet and pilates. Expect a low-impact workout - perfect if you're new to exercise, or returning after a long break. Combining strength training with static stretching, Barre focuses on isolating muscle groups, through high repetitions with low, or no weights.\n\nWe operate a 0 minute latecomer policy for all Barre classes.","MAT PILATES":"Build strength, improve flexibility, and develop control and endurance with Mat Pilates. This dynamic mat-based class will fire up your core with low impact exercises to strengthen and tone your entire body. Our trainers use both classical and contemporary approaches to create physically challenging classes open to all levels.","REFORMER PILATES L3":"For when you’re ready to take it up a level. This class pushes both body and mind with more complex sequences, quicker transitions and advanced technical skill-building. A solid understanding of Pilates principles and the Reformer machine is essential. Blending classical and contemporary approaches, you’ll move through a faster-paced, challenging full-body workout designed for those who can maintain strong form and are ready to progress further. We recommend having taken at least 10 Reformer classes before trying L3. Please note: not suitable for beginners, pre/post-natal clients or those with significant injuries.","DYNAMIC VINYASA":"A creative and energetic practice that matches breath to movement, enhancing a strong mind-body connection. Postures flow intentionally in a sequence known as 'vinyasa,' emphasising a special placement. Instructors may guide towards a peak pose or explore yoga philosophy.","REFORMER PILATES L1":"The perfect place to start. Learn the fundamentals of Reformer Pilates in a safe, supportive environment. Build confidence, technique and body awareness as you establish the foundations of your practice. Ideal for those who are newer to Reformer, Improvers or anyone wanting to move at a gentler pace and refine their technique.","BLOKSCULPT":"Combining toning exercises with a high intensity workout, BLOKsculpt is perfect for fans of barre and yoga, looking to introduce HIIT into their training. Experience 15 mins of short burst cardio exercises followed by 25 mins of smaller, isolated movements using light weights and high reps. The cardio element of this class focuses on improving cardio endurance, whilst the isolations aim to tone and strengthen your body, focusing on your arms, shoulders, core and glutes.","POWER YOGA":"Immerse yourself in a robust practice centred on physical endurance, core strength, and purposeful breath. Expect to build heat, cultivate determination and play with skill-based drills. Find a clearer mind, enhanced focus and a deeper awareness of your anatomical alignment. This class is best suited to those with an existing movement practice. Some prior experience is recommended, as the pace and intensity may not be suitable for complete beginners.","BLOKSTRENGTH: FULL BODY":"Build muscular strength and endurance from head-to-toe on our full body days. Each session in the week will vary between strength, hypertrophy and endurance training to help build muscles conditioned to whatever life throws at it. Using a mix of dumbbells, kettlebells, bodyweight and other accessory equipment you will be challenged through your full range of movement, unilaterally and across all planes of movement.","POWER REFORMER L2":"With the addition of the jumpboard, this class fuses plyometric cardio with Pilates precision to build stamina, endurance and full-body control. Designed for intermediate-level clients with a strong understanding of Pilates principles and the Reformer machine, you’ll progress into faster-paced, athletic sequences that challenge strength, coordination and core stability. We recommend having taken at least 10 Reformer classes before trying Power Reformer L3. Please note: not suitable for beginners, pre/post-natal clients, or those with significant injuries.","CALISTHENICS":"Discover the strength-based challenge of calisthenics, utilising your bodyweight to create unique and challenging workouts. Suitable for beginners and experienced practitioners, these classes develop upper body strength, endurance, and core strength that could rival a gymnast.","BLOKFIT":"Improve your overall fitness with BLOKfit, a dynamic full-body circuit class combining strength and cardio. Working in timed intervals with little or no rest between stations, you'll target each muscle group using a range of equipment from free weights, battle ropes, slam balls and more. BLOKfit will improve your cardiovascular endurance, strength, power, speed and agility.","BLOKSTRENGTH: LOWER BODY":"Build strength and endurance in your squat, deadlift, and lunge. This structured lower body session uses free weights, boxes and bodyweight to improve technique, balance muscle growth and support joint health. Strengthen key movement patterns, reduce injury risk and challenge both major and stabilising muscles to enhance your lower body performance and muscular control.","HOT + COLD QUIET":"Quiet sessions at Hot + Cold offer a more introspective take on our signature contrast therapy experience. With minimal distractions and a focus on stillness, this is your invitation you to slow down, regulate your nervous system and reconnect with your inner rhythm. Rooted in ancient sauna and cold-water traditions, and shaped by a modern, integrative approach, each session is designed to build resilience, support recovery and create space for presence.","BLOKSTRENGTH: UPPER BODY":"Strengthen your shoulders, arms, chest and back with structured programming and progressive training. This session focuses on lifting technique, upper body strength and endurance. Using free weights, bodyweight and varied equipment, you’ll isolate, stabilise and challenge muscles to improve control, size and performance while building a strong, well-balanced upper body from every angle.","BLOKPOWER":"BLOKpower is a high-intensity class that builds explosive strength, sharpens speed and challenges your body to go all in. Combining power-driven plyometrics and active strength recovery, this session targets your top performance zone. Expect high-impact sets, explosive movements and real sweat. All levels welcome.","BOXCON":"Boxcon is a fun, fast-paced class, combining bag sequences, bodyweight drills and resistance exercises to push you to your limits. Mixing training techniques from the world's best boxers with traditional strength & conditioning exercises, Boxcon will improve your fitness, boxing technique and cognitive skills.Suitable for beginners and experienced boxers alike. \n\nHand wraps are strongly advised and available to be purchased at reception for £5. We advise customers to bring their own gloves if possible, however we also provide gloves in-class. Boxing gloves are also available to be purchased at reception for £55.","YIN YOGA":"Quiet the mind in this contemplative practice blending Traditional Chinese Medicine with Eastern Philosophy. Long-held, passive yoga postures target deep connective tissue, improving joint mobility and stimulating meridian lines. Experience the deep release tension, allowing energy to flow freely.","HANDSTANDS":"Find progression with Handstands. True to the BLOK ethos, these skill-based classes will set you new challenges and reward dedication and perseverance. Working from the foundations up, these classes focus on drills and exercises to build the strength and flexibility required for the perfect handstand. No prior experience required.","BLOKCORE":"A strong core sets you up for life, and makes every class that bit easier. Designed to keep core training interesting, BLOKcore goes beyond crunches to improve core and lower body strength. Using weights, TRX suspension training, and bodyweight exercises, (including mountain climbers, pikes and leg raises), BLOKcore will help you achieve the core strength you've always wanted, challenging your body in exciting new ways.","BLOKMOBILITY":"BLOKmobility is our signature class for improving the way you move. Using a mix of resistance, bodyweight and weighted exercises, you’ll build strength, flexibility and control while increasing your range of movement. Each month you’ll work towards a specific mobility skill like front splits or single leg squats through structured progressions that combine targeted strength work and drills to support how you move across the rest of the training schedule and in everyday life.","YOGA WITH MEDITATION":"Create space in your day for a moment of peace in the mind. Combining calming breathwork with physical yoga practice, this grounding practice releases tension from the body, quietens the mind, and prepares you for an extended guided meditation.","SMALL GROUP PT: FULL BODY":"Small Group PT is a structured strength programme, delivered in a group of six. Full Body sessions combine lower and upper body work in a single session giving you a complete strength workout covering functional movement and balanced muscular strength. Your trainer adapts every session to your ability and goals, recording your weights each session so the programme keeps moving you forward. Ideal if you're ready to train with real focus and structure, and see what consistent, coached progression can do. New to Open Gym? We recommend completing a complimentary Intro to Open Gym session first.","BLOKBREATH":"Explore powerful breathing techniques that regulate the nervous system, alleviate physical tension and enhance your resilience in handling daily stressors. Engage in rhythmic circular breathing patterns to access deep meditative states and promote rest and recovery. This class is not suitable if you are pregnant. Please contact your physician if you have any of the following conditions: history of heart disease/cardiovascular issues, history of seizures, high blood pressure.","HOT + COLD GUIDED: Recover":"Designed to support peak performance and post-training integration. RECOVER focuses on circulation, mobility and gentle nervous system down-regulation to help muscles and joints repair after strength or high-impact training. Guided rounds of sauna and cold immersion are paired with mobility drills, breathwork and contrast-focused sequencing to create an optimal internal recovery state. Leave feeling rebalanced, supple and restored.","SMALL GROUP PT: LOWER BODY":"Small Group PT is a structured strength programme, delivered in a group of six. Lower Body sessions cover the push and pull movements that build a strong foundation - squats, deadlifts, lunges and key accessory work. Your trainer adapts every session to your ability and goals, recording your weights each session so the programme keeps moving you forward. Ideal if you're ready to train with real focus and structure, and see what consistent, coached progression can do. New to Open Gym? We recommend completing a complimentary Intro to Open Gym session first.","BLOKSOUND":"Activate calming theta brainwave frequencies, release tension and create space for peaceful self-reflection using the healing influence of sound. Our instructors work with a variety of instruments from quartz crystal or Tiebetan bowls, to harmonious gongs for a unique and restorative sensory journey.","HOT + COLD GUIDED: Unwind":"A soothing contrast therapy experience to help you slow down, soften and let go. UNWIND weaves breath-led movement, restorative heat and gentle cold immersion into a guided flow designed to shift you into deep parasympathetic rest. Ideal for evening or end-of-day restoration, this session uses soft breathwork, meditative pacing and calming sensory inputs to bring your body back into balance. Expect to leave feeling grounded, nourished and deeply relaxed.","SMALL GROUP PT: UPPER BODY":"Small Group PT is a structured strength programme, delivered in a group of six. Upper Body sessions cover the push, pull and carry movements that build a strong, capable upper body - bench press, row, overhead press, cable and isolation work. Your trainer adapts every session to your ability and goals, recording your weights each session so the programme keeps moving you forward. Ideal if you're ready to train with real focus and structure, and see what consistent, coached progression can do. New to Open Gym? We recommend completing a complimentary Intro to Open Gym session first.","YIN YANG FLOW":"Find space and strength in this balanced yoga practice. Engage in dynamic Yang-style moving meditation emphasising muscularity and conscious breath connection. Soften into relaxation by incorporating extended release work with Yin, promoting improved mental clarity and mobility.","HOT + COLD GUIDED: Energise":"The perfect pick-me-up for body and mind. ENERGISE blends the ancient practices of sauna and cold water therapy with breathwork and embodied movement to sharpen focus, uplift mood and unlock flow. Guided by an instructor, this session includes energising breathwork, task-based mindfulness and sensory tools designed to help you shift gears and reignite creativity. Expect a bright, dopamine-boosting session to leave you clear, focused and mentally recharged.","Reps Kulture":"Cali Kulture's signature Calisthenics class where you’ll work on pull-ups, dips, push-ups and rows. In the beginners classes you’ll work on the fundamentals; in the intermediate classes you’ll increase reps and introduce skills.\n\nReps Kulture – Beginners Prerequisites: Must be able to hang from a pull-up bar for 10 seconds. (Not much!)","Rocket":"Rooted in Ashtanga Vinyasa Yoga, these sequences have some traditional poses that you may recognise and a few funky transitions you may not. Sun salutations warm the body, a strong standing section will strengthen, then the seated asana allow you to really focus the mind and get deep into your practice. Expect a sprinkling of inversions for those that like to go upside down and an emphasis on the breath. Helen teaches a light-hearted, don’t-take-yourself-too-seriously Rocket class that leaves you feeling higher and stronger. Float away with a smile.\n\nMusic is often played in this class\n\nFor those who enjoy a strong and dynamic practice. You can modify to suit your body and you don’t need to be able to handstand.","Ashtanga Guided Self Practice":"The ashtanga yoga sequence is designed to regulate the nervous system – the guided self-practice method is a holistic meditative movement discipline that affects the whole mind body organism. Using three points of concentration it brings you into a state of inner presence. Having a quiet space to move, breathe and meet oneself in silence is an invaluable start to each day.\n\n \n\nThis is not a led class in the traditional sense – you will be taught individually, at your level, as you learn the sequence posture-by-posture, until you know it from memory. Whilst there is a strong relational aspect between the facilitator  and practitioner, Corrie applies an autonomous approach to encourage personal inquiry and ultimately deepen your understanding of the postures. This makes for a very rich experience. \n\n \n\nThis is an accessible and inclusive class that will teach you to practise in a way that supports your everyday life. Finding your body’s unique entry point to each posture will allow you to build healthy movement patterns, equalise your body’s imbalances and facilitate somatic healing. Over time, practitioners can become more intentional, congruent, and personally aligned.","Squat Kulture":"The back squat is a powerful movement that will build strength throughout the lower body. In the beginners classes you’ll perfect technique; in the advanced class you’ll add to your 1RM (one rep max). Not recommended for those with lower back injuries.\n\nSquat Kulture – Advanced Prerequisites: Must already be able to back squat at least 80% of your bodyweight for 1 rep. (So if you weigh 50kg, you must be able to back squat 40kg for one rep.) Not suitable if you have a lower back injury.","Vinyasa Flow":"A traditional vinyasa class that flows fluidly through a sequence of postures, linked by deep breath and smooth movement. You’ll start your practice with gentle stretches, muscle energy techniques, sun salutations and standing postures (including balance work!) before settling down to the floor for twists, forward bends and back bends. This all-round practice is gently brought to a close with calming postures that result in a deep sense of contentment and calm.\n\nThis class is taught with music.","Pilates":"Pilates is a method developed by Joseph Pilates in early 20th century, and then was taken to New York in the 50s, where it became popular amongst dancers and athletes who used the method to train their bodies. Now globally known and used because of its strong focus around strengthening and toning the core, it supports other practices such as yoga, gymnastics and weight training. \n\nIn our classes you can expect to focus on stability, flexibility and strength. Each session emphasises precision and control, mobility, sculpting and stretching muscles, and using your own body weight dynamically as a way to to build up resilience. Through consistent commitment, you'll deepen your workout by learning the sequence and choreography of each exercise while incorporating the guiding principles; Breath, Concentration, Control, Precision, Centre and Flow.\n\nThe classes are vigorous, fun and energetic, all are welcome.","Bambu Bodies":"Bambu Bodies is a mixed movement class inspired by the Capoeira practice.\n\nThe class has a set sequence and structure that starts with movement exercises (squats, press-ups, sit-ups) before exploring floorwork where you work on proprioception and body awareness, before finishing with mobility exercises to develop strength and flexibility.","Hot 26&2":"The original hot yoga class comprises of 26 postures and 2 breathing exercises. \n\nFocused particularly on strengthening and improving the health of the spine, this is therapeutic class is accessible for everyone. That means that if you’re new to yoga you’ll get a lot out of it, and the more experienced you are, the more you’ll be able to refine your precision of alignment and intensity of effort. \n\nThe format is always the same, not only allowing your body to understand the movements over time, but for mind to reach a place stillness through ritual and breath.","Dharma":"Dharma Yoga is a system of classical Hatha Raja yoga based on the teachings of New York’s renowned master of yoga Sri Dharma Mittra whose wisdom is based on love and compassion.\n\n \n\nIn this class, Emi will help you develop strength and flexibility through the Shiva Namaskar Vinyasa, a flowing sequence which is both physically and mentally challenging. Modifications and variations will be given so as to enjoy our time together.\n\n \nPranayama and chanting are also included to calm the mind and purify the heart.\n\n\nClasses are suitable for those with some experience of yoga and particularly those looking for a challenge.","Dynamic Vinyasa":"A strong, energetic vinyasa practice, both physically and spiritually uplifting, moving consciously from one posture to the next, linked via the breath to raise your consciousness and allow you to access deep meditative states.\n\nClasses are infused with music, hands-on adjustments and an unmistakable sense of humour.\n\nThis class is for those who are up for a challenge as well as the experienced.","Handstands":"Are you new to handstands, or have you recently started? This class will teach you all the basics to get you balancing on your hands in an upside down world. You'll learn how to build your confidence, and overcome your fear. You'll build strength, and develop awareness of the position of your hands, shoulders, spine, pelvis and feet when upside down.   \n\nBuild this class into your weekly schedule so that one day you might effortlessly float up into handstand in the middle of a yoga class.","Yin":"This class focuses on long held postures, targeting different physical areas of the body, connective tissue, as well as targeting meridian channels in the body while observing a deeper layer of the mind. This practise connects us to the feeling and awareness of Chi, and allows us to go deeper into introspection and self study.","Skills Kulture":"The bent arm strength class that develops strength and technique for the bar and ring muscle-ups, as well as handstand push-ups. Not for beginners but for those looking to take their training to the next level.\n\nSkills Kulture – Intermediate Prerequisites: Must have at least 10 strict bodyweight pull ups and 15 strict bodyweight dips and be able to kick up to a wall in a handstand.","Balance Kulture":"Start your handstand journey by learning the fundamentals before moving away from the wall and learning to free stand balance with confidence.\n\nBalance Kulture – Beginners Prerequisites: You should able to hold a straight arm plank for 60 seconds.","Skills & Reps Kulture":"In this Cali Kulture Calisthenics class, we’ll kick things off by working on skills like levers, muscle-ups, and balance. In the second half, it’s all about building strength with pull-ups, dips, push-ups, and rows. Expect a session focused on control, technique, and progression.\n\nPrerequisites:\nNot suitable for complete beginners. You must have completed at least 5 Reps Kulture: Beginners classes before attending.","Iyengar Yoga":"Iyengar Yoga was designed by the late B.K.S Iyengar in Pune, India. The style is renowned for its detail, precision and alignment. Expect to use props -- lots and lots of props!","Mobility Kulture":"This class is a core component of the Cali Kulture method. Finding a balance between strength and mobility is key to avoiding injuries and improving performance in particular Calisthenics movements.This class will focus on strengthening and mobilising the lower body.","Rings":"A scalable class designed to build your bodyweight strength, stability, mobility and coordination.\n\nIntermediate class will still build strength in your foundational movement patterns, but with a detailed focus on building the menchanics of your ring muscle ups, levers and longer ring endurance flows.\n\nIntermediate prerequisite: 5-10 strong pullups, 5-10 strong dips.","Boxing":"Our dynamic one-hour boxing class is designed to build strength, speed, and technique through partner drills, bag work, and pad work. You'll sharpen your punches with focus mitts, practice combinations on heavy bags, and improve your timing and defence with partner exercises. The session also includes bodyweight conditioning to enhance your overall endurance and power. Perfect for all levels, this high-energy workout will challenge your fitness while sharpening your boxing skills.","Total Reps Kulture":"Total Reps Kulture is a full-body calisthenics and strength class. The first half focuses on upper body exercises using methods from our Reps Kulture classes, while the second half targets the lower body with movements inspired by our Squat Kulture classes.","Yoga Inversions":"This upbeat invigorating class developed by Nicki Ratcliffe and Emily Mergaert – two yogis who spend too much time on their hands – is all about the thirst/hunger for inversions in the yoga game.\n\nCarefully curated drills inspired from different disciplines; from gymnastics to circus, and back to yoga are broken down in this class, to give the practitioner the knowledge and courage to fly with confidence.\n\nPrerequisites: You must be confident kicking up into a handstand in the middle of the room and able to hold a handstand against a wall for 30 seconds.","Daoist Flow":"Daoist Flow brings together the essence of yoga, somatics and qigong.\n\nClasses are deep slow flows, that take time to listen, feel and be with bodyful awareness of breath, movement and stillness. Great for reducing stress and tension, while building strength, steadiness and ease.\n\nAll levels of experience are welcome.","Kundalini":"Integrated Kundalini is a yoga approach and practice rooted in the discovery of our true essence.\n\nA class is based on Kriyas; sequences that include postures, breath techniques, meditations and mantra.  \n\nThe choreography of a kriya drives the intensity of the class, with the energy often building to a crescendo, a peak from which the practitioner may experience deepened states of awareness, peace & vitality.","MyoYin":"MyoYin is a specialised class that combines targeted myofascial release ball techniques, with the long, slow, passive yin yoga holds. Practiced individually, these modalities are known to improve mobility, enhance the integrity of the tissues, aid in muscle recovery and optimize physical performance. When combined, the effects are amplified, leaving you functioning better and feeling good from the inside out.","Strength Kulture":"This is our weighted calisthenics class, the focus of which is to build up to big one rep maxes! Exclusively working on pull-ups/chin-ups and dips, this class is for you if you want to gain a super human level of strength.\n\nStrength Kulture – Advanced Prerequisites: Must be able to perform at least 10 strict unbroken bodyweight pull-ups and 15 strict bodyweight dips for 4/5 rounds.","Yoga":"Stewart is a senior registered yoga teacher with more than 20 years teaching experience. His classes are dynamic, challenging, and innovative. Stewart’s high energy, radical classes are peppered with humour, philosophy, politics and physical adjustments. The emphasis is on the breath, and he applies the original teachings of yoga to the modern world. The result? A thought-provoking class. He teaches dhyana (meditation,) mantra (chant,) asana (posture) and pranayama (breathing.)\n\nThe class includes a Vinyasa Krama practice that maintains a regular sequence over a period of time to offer the practitioner the opportunity to progress and develop incrementally.","Full Body Mobility":"Looks to increase your range of motion across the body, touching on the shoulders, spine and hips. Another good class for pretty much everyone and it can be scaled appropriately for what your current level is.","Ashtanga":"All of the Ashtanga yoga sequences hold their foundations in standing postures. This short class focuses on consolidating the standing, and early seated postures of the primary series. Ideal for newer practitioners or those wishing to enjoy a grounding, energising, short practice. \n\nMission is committed to nurturing the next generation of yoga teachers: Amit, Nino and Patricia are all qualified yoga teachers, and long term ashtanga practitioners, who assist Corrie - the lead teacher of Mission's Ashtanga Yoga Guided Self Practice programme. They will rotate teaching this class weekly, leading students through the traditional count of the primary series, starting with Surya Namaskar A up to Janu Sirsasana A, followed by a modified closing sequence.\n\nBeginners are welcome and so are those with knowledge of the Ashtanga Yoga system. This class is open to all abilities and body types.","Core Conditioning":"The core runs much deeper than the physical aesthetics of the abs. This class will teach you how to properly train your core from the pelvis to the ribcage with a series of mobility and strength drills. Using your bodyweight and kettlebells, you'll soon see an improvement in your balance, endurance, posture and all-round performance.","Statics Kulture":"This is our static skills Calisthenics class. The focus of this class is learning how to do static movements like the Front Lever and Back Lever. The class will focus on these in addition to some accessory exercises to complement those movements. If you’ve mastered the basics and want to learn more advanced skills, this is the class for you."},STUDIO_URL={"Clapton":"https://classpass.com/studios/blok-clapton-london","Shoreditch":"https://classpass.com/studios/blok-shoreditch-london","Mission E1":"https://classpass.com/studios/mission-e1-london"};

var selB=clean(g(LS.t,null),orderB), selM=clean(g(LS.m,null),orderM);
// First visit: start with the calisthenics / strength classes favourited.
// Once the user has touched a star their saved list wins, including an
// empty one - DEFAULT_FAVS must not creep back in after they clear it.
var favs=g(LS.v,null);
if(!Array.isArray(favs))favs=DEFAULT_FAVS.slice();
// A browser that saved favourites under an older build would otherwise never
// see new defaults - its saved list wins forever, and the star rows look
// empty. Stamp the defaults; when they change, merge them in ONCE, keeping
// everything the user starred themselves.
if(g(LS.vv,'')!==DEFAULT_FAVS.join('~')){
 DEFAULT_FAVS.forEach(function(k){if(favs.indexOf(k)<0)favs.push(k)});
 s(LS.v,favs);s(LS.vv,DEFAULT_FAVS.join('~'));
}
favs=favs.filter(function(k){var p=k.split('|');return (p[0]==='B'&&orderB.indexOf(p[1])>-1)||(p[0]==='M'&&orderM.indexOf(p[1])>-1)});
var av=document.getElementById('av'),hf=document.getElementById('hf'),hw=document.getElementById('hw');
av.checked=!!g(LS.a,false);hf.checked=!!g(LS.f,false);hw.checked=!!g(LS.w,false);
var ROWS=[['allFavM','favM','M'],['allCatM','catsM','M'],['allFavB','favB','B'],['allCatB','catsB','B']];
function boxesIn(rowId){return [].slice.call(document.getElementById(rowId).querySelectorAll('input[data-c]'))}
function boxes(venue){return ROWS.filter(function(r){return r[2]===venue})
 .reduce(function(a,r){return a.concat(boxesIn(r[1]))},[])}
ROWS.forEach(function(r){
 var master=document.getElementById(r[0]);
 master.addEventListener('change',function(){
  boxesIn(r[1]).forEach(function(x){x.checked=master.checked});
  sync(r[2]);
 });
});
function refreshAll(){
 ROWS.forEach(function(r){
  var bs=boxesIn(r[1]),m=document.getElementById(r[0]),n=bs.filter(function(x){return x.checked}).length;
  m.checked=bs.length>0&&n===bs.length;
  m.indeterminate=n>0&&n<bs.length;
  m.disabled=bs.length===0;
 });
}
// The non-favourites list is long (35 and 46 types). Collapse it per gym and
// remember the choice. Collapsing only hides the chips - it never changes
// which categories are selected, so the table below is untouched.
var COL=g(LS.c,null); if(!COL||typeof COL!=='object')COL={M:false,B:false};
function paintCol(venue){
 var row=document.getElementById(venue==='M'?'catsM':'catsB');
 var btn=document.getElementById(venue==='M'?'colM':'colB');
 var n=row.querySelectorAll('.chip').length, off=!!COL[venue];
 row.className='row'+(off?' collapsed':'');
 btn.setAttribute('aria-expanded',off?'false':'true');
 btn.textContent=(off?'▸ ':'▾ ')+n+' more';
 btn.title=(off?'Show':'Hide')+' the non-favourite filters';
}
['M','B'].forEach(function(v){
 document.getElementById(v==='M'?'colM':'colB').addEventListener('click',function(){
  COL[v]=!COL[v]; s(LS.c,COL); paintCol(v);
 });
});
var CHIPS={M:[],B:[]};
function build(wrapId,order,sel,venue){
 order.forEach(function(c){
  var l=document.createElement('label');l.className='chip';
  var i=document.createElement('input');i.type='checkbox';i.checked=sel.indexOf(c)>-1;i.dataset.c=c;
  i.addEventListener('change',function(){sync(venue)});
  var d=document.createElement('span');d.className='dot';d.style.background=PC[c];
  var t=document.createElement('span');t.textContent=c;
  var n=document.createElement('span');n.className='n';n.textContent=CATS[c]||0;
  l.appendChild(i);l.appendChild(d);l.appendChild(t);l.appendChild(n);
  var b=document.createElement('button');b.className='star';b.type='button';
  var key=venue+'|'+c,on=favs.indexOf(key)>-1;
  b.setAttribute('aria-pressed',on?'true':'false');
  b.textContent=on?'★':'☆';
  b.title=(on?'Unfavourite ':'Favourite ')+c;
  b.addEventListener('click',function(){
   var j=favs.indexOf(key);
   if(j>-1)favs.splice(j,1);else favs.push(key);
   s(LS.v,favs);
   place(venue);
  });
  var chip=document.createElement('span');chip.className='chip';
  chip.appendChild(l);chip.appendChild(b);
  CHIPS[venue].push({cat:c,key:key,el:chip,star:b});
 });
 place(venue);
}
function place(venue){
 var favRow=document.getElementById(venue==='M'?'favM':'favB');
 var allRow=document.getElementById(venue==='M'?'catsM':'catsB');
 var nfav=0;
 CHIPS[venue].forEach(function(ch){
  var on=favs.indexOf(ch.key)>-1;
  ch.star.setAttribute('aria-pressed',on?'true':'false');
  ch.star.textContent=on?'★':'☆';
  ch.star.title=(on?'Unfavourite ':'Favourite ')+ch.cat;
  (on?favRow:allRow).appendChild(ch.el);   // master 'all' label stays first, it is never moved
  if(on)nfav++;
 });
 favRow.className='row fav'+(nfav?' on':'');
 paintCol(venue);
 refreshAll();
}
build('catsM',orderM,selM,'M');
build('catsB',orderB,selB,'B');
function sync(venue){
 // must read BOTH rows: a favourited chip lives in the fav row, and reading
 // only the main row silently deselects every favourite.
 var picked=boxes(venue).filter(function(x){return x.checked}).map(function(x){return x.dataset.c});
 if(venue==='M'){selM=picked;s(LS.m,selM)}else{selB=picked;s(LS.t,selB)}
 refreshAll();
 draw();
}
[[av,LS.a],[hf,LS.f],[hw,LS.w]].forEach(function(p){p[0].addEventListener('change',function(){s(p[1],p[0].checked);draw()})});
document.getElementById('reset').addEventListener('click',function(){
 av.checked=false;hf.checked=false;hw.checked=false;
 s(LS.a,false);s(LS.f,false);s(LS.w,false);
 // Reset also restores the default favourites. Without this there is no way
 // back to them once a saved list exists - which reads as "the defaults are
 // missing" on any browser that used an older build.
 favs=DEFAULT_FAVS.slice();s(LS.v,favs);
 place('M');place('B');
 [].slice.call(document.querySelectorAll('#catsM input,#catsB input')).forEach(function(x){x.checked=true});
 selB=orderB.slice();selM=orderM.slice();s(LS.t,selB);s(LS.m,selM);
 refreshAll();
 draw();
});
function dl(iso){var d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}
function sd(iso){var d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}
(function(){
 var mine=D.filter(function(r){return r[7]==='booked'});
 if(!mine.length)return;
 var h='<h2>Your booked classes ('+mine.length+')</h2><ul>';
 mine.forEach(function(r){
  h+='<li><span class="bt">'+sd(r[0])+', '+r[2]+'</span><span class="bl">'+r[4]+' · '+r[6]+'</span><span class="bn">'+r[5]+' · '+r[3]+' min</span></li>';
 });
 var bx=document.getElementById('booked');bx.innerHTML=h+'</ul>';bx.style.display='block';
})();
function addRow(tb,r,cur){
 if(r[0]!==cur){var dr=tb.insertRow();var dc=dr.insertCell();dc.colSpan=6;dc.textContent=dl(r[0]);dr.className='day'}
 var tr=tb.insertRow();
 tr.setAttribute('data-cat',r[4]);tr.setAttribute('data-state',r[7]);
 tr.setAttribute('data-avail',r[7]==='bookable'?'1':'0');
 tr.setAttribute('data-wd',r[9]);tr.setAttribute('data-mins',r[1]);
 tr.insertCell().outerHTML='<td class="t">'+r[2]+'</td>';
 tr.insertCell().outerHTML='<td class="mins mut">'+r[3]+'</td>';
 var d=DESC[r[4]]||'';
 tr.insertCell().outerHTML='<td><span class="pill'+(d?' hasd':'')+'" style="background:'+PC[r[4]]+'"'
  +(d?' title="'+d.split('"').join('&quot;')+'"':'')+'>'+r[4]+'</span></td>';
 tr.insertCell().textContent=r[5];
 var su=STUDIO_URL[r[6]];
 tr.insertCell().outerHTML=su?('<td><a href="'+su+'" target="_blank" rel="noopener">'+r[6]+'</a></td>'):('<td>'+r[6]+'</td>');
 tr.insertCell().outerHTML='<td class="st" style="color:'+SC[r[7]]+'">'+r[8]+'</td>';
 return r[0];
}
function draw(){
 var tb=document.getElementById('tb');tb.innerHTML='';
 var cur='',shown=0,cnt={};
 D.forEach(function(r){
  var sel=r[10]==='M'?selM:selB;
  if(sel.indexOf(r[4])<0)return;
  if(av.checked&&r[7]!=='bookable')return;
  if(hf.checked&&r[7]==='full')return;
  if(hw.checked&&r[9]<5&&r[1]>=480&&r[1]<=1045)return;
  cnt[r[7]]=(cnt[r[7]]||0)+1;shown++;
  cur=addRow(tb,r,cur);
 });
 document.getElementById('none').style.display=shown?'none':'block';
 document.getElementById('shown').textContent=shown+' of '+D.length+' shown';
 var lab=[['bookable','Bookable'],['full','Full'],['soon','Not yet open'],['booked','Booked'],['closed','Closed']];
 var lg=document.getElementById('lg');lg.innerHTML='';
 lab.forEach(function(p){
  if(!cnt[p[0]])return;
  var e=document.createElement('span');
  e.innerHTML='<i style="background:'+SC[p[0]]+'"></i>'+p[1]+' <b>'+cnt[p[0]]+'</b>';
  lg.appendChild(e);
 });
}
refreshAll();
draw();
</script><!-- classes:1832 -->
</body></html>
