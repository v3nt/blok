function saveTypes(){
  var o=[];
  cw.querySelectorAll('input[data-cat]').forEach(function(i){
    if(!i.checked)o.push(i.getAttribute('data-cat'));});
  off={};o.forEach(function(c){off[c]=1;});
  set(LS.types,o.join(','));
}

var catColour=[],catId=[];
D.cats.forEach(function(c){catColour.push(c[2]);catId.push(c[0]);});
var stId=[],stColour=[];
D.states.forEach(function(s){stId.push(s[0]);stColour.push(s[2]);});

// unpack the fixed-width row string: date(1) time(2) dur(1) name(2) inst(2) studio(1) status(2)
var P=D.p,NROW=P.length/11,ROWS=new Array(NROW);
for(var q=0;q<NROW;q++){
  var o=q*11;
  ROWS[q]=[parseInt(P.substr(o,1),36),parseInt(P.substr(o+1,2),36)*5,
           parseInt(P.substr(o+3,1),36)*5,parseInt(P.substr(o+4,2),36),
           parseInt(P.substr(o+6,2),36),+P.charAt(o+8),
           parseInt(P.substr(o+9,2),36)];
}
var WDC=D.dates.map(function(s){return pd(s).getDay();});

var tb=document.getElementById('tb');
function render(){
  var html='',cur=-1,n=0;
  for(var i=0;i<NROW;i++){
    var r=ROWS[i],di=r[0],wd=WDC[di],ai=r[6],si=D.atstate[ai],st=stId[si],
        ci=D.namecat[r[3]],cid=catId[ci];
    if(off[cid])continue;
    if(elA.checked&&st!=='bookable')continue;
    if(elF.checked&&st==='full')continue;
    if(elW.checked&&wd>=1&&wd<=5&&r[1]>=480&&r[1]<=1045)continue;
    if(di!==cur){cur=di;html+='<tr class="day"><td colspan="6">'+dlab(D.dates[di])+'</td></tr>';}
    var s=D.studios[r[5]];
    html+='<tr data-cat="'+esc(cid)+'" data-state="'+st+'" data-avail="'+
      (st==='bookable'?1:0)+'" data-wd="'+wd+'" data-mins="'+r[1]+'">'+
      '<td class="tm">'+tlab(r[1])+'</td>'+
      '<td class="hide-sm mut">'+r[2]+'</td>'+
      '<td class="cls"><i class="dot cdot" style="background:'+catColour[ci]+'"></i>'+
        esc(D.names[r[3]])+'</td>'+
      '<td class="hide-sm mut">'+esc(D.insts[r[4]])+'</td>'+
      '<td><a href="'+esc(s[1])+'" target="_blank" rel="noopener">'+esc(s[0])+'</a></td>'+
      '<td class="st" style="color:'+stColour[si]+'">'+esc(D.atexts[ai])+'</td></tr>';
    n++;
  }
  if(!n)html='<tr><td colspan="6" class="nores">No classes match these filters.</td></tr>';
  tb.innerHTML=html;
  document.getElementById('shown').textContent=n+' of '+NROW+' shown';
}

elA.addEventListener('change',function(){set(LS.avail,elA.checked?'1':'0');render();});
elF.addEventListener('change',function(){set(LS.full,elF.checked?'1':'0');render();});
elW.addEventListener('change',function(){set(LS.work,elW.checked?'1':'0');render();});
cw.addEventListener('change',function(){saveTypes();render();});
document.getElementById('reset').addEventListener('click',function(){
  elA.checked=false;elF.checked=false;elW.checked=false;
  cw.querySelectorAll('input[data-cat]').forEach(function(i){i.checked=true;});
  set(LS.avail,'0');set(LS.full,'0');set(LS.work,'0');set(LS.types,'');
  off={};render();
});
render();
</script></body></html>
