function avail(code){
  if(/^C\d+$/.test(code)) return ['bookable','Bookable ('+code.slice(1)+' credits)'];
  if(code==='FULL')   return ['full','Full — no spots left'];
  if(code==='CLOSED') return ['closed','Booking closed'];
  if(code==='BOOKED') return ['booked',"You're booked"];
  if(code.indexOf('OPEN:')===0) return ['soon','Books open '+code.slice(5)];

}

function apply(){
  var on=cats.filter(function(c){return c.checked;}).map(function(c){return c.value;});

}
