s perfect for regular practice and steady progression. Building on the foundations from Reformer L1, you’ll move at a faster pace, combining classical and dynamic movements for a fun, creative and challenging full-body workout. If you’re completely new to Reformer we recommend attending at least 3 Reformer Pilates classes first.","HOT + COLD":"HOT + COLD combines ancient sauna and cold water therapy traditions with a modern, integrated approach. Designed to build resilience, boost performance, and regulate your nervous system, this offering invites you to explore the transformative power of temperature contrasts. In this self guided session you have the autonomy to create a structure that is best suited for your body.","BARRE":"Improve posture, increase flexibility and define muscles with Barre. Barre is a method of training inspired by ballet and pilates. Expect a low-impact workout - perfect if you're new to exercise, or returning after a long break. Combining strength training with static stretching, Barre focuses on isolating muscle groups, through high repetitions with low, or no weights.\n\nWe operate a 0 minute latecomer policy for all Barre classes.","MAT PILATES":"Build strength, improve flexibility, and develop control and endurance with Mat Pilates. This dynamic mat-based class will fire up your core with low impact exercises to strengthen and tone your entire body. Our trainers use both classical and contemporary approaches to create physically challenging classes open to all levels.","REFORMER PILATES L3":"For when you’re ready to take it up a level. This class pushes both body and mind with more complex sequences, quicker transitions and advanced technical skill-building. A solid understanding of Pilates principles and the Reformer machine is essential. Blending classical and contemporary approaches, you’ll move through a faster-paced, challenging full-body workout designed for those who can maintain strong form and are ready to progress further. We recommend having taken at least 10 Reformer classes before trying L3. Please note: not suitable for beginners, pre/post-natal clients or those with significant injuries.","DYNAMIC VINYASA":"A creative and energetic practice that matches breath to movement, enhancing a strong mind-body connection. Postures flow intentionally in a sequence known as 'vinyasa,' emphasising a special placement. Instructors may guide towards a peak pose or explore yoga philosophy.","REFORMER PILATES L1":"The perfect place to start. Learn the fundamentals of Reformer Pilates in a safe, supportive environment. Build confidence, technique and body awareness as you establish the foundations of your practice. Ideal for those who are newer to Reformer, Improvers or anyone wanting to move at a gentler pace and refine their technique.","BLOKSCULPT":"Combining toning exercises with a high intensity workout, BLOKsculpt is perfect for fans of barre and yoga, looking to introduce HIIT into their training. Experience 15 mins of short burst cardio exercises followed by 25 mins of smaller, isolated movements using light weights and high reps. The cardio element of this class focuses on improving cardio endurance, whilst the isolations aim to tone and strengthen your body, focusing on your arms, shoulders, core and glutes.","POWER YOGA":"Immerse yourself in a robust practice centred on physical endurance, core strength, and purposeful breath. Expect to build heat, cultivate determination and play with skill-based drills. Find a clearer mind, enhanced focus and a deeper awareness of your anatomical alignment. This class is best suited to those with an existing movement practice. Some prior experience is recommended, as the pace and intensity may not be suitable for complete beginners.","POWER REFORMER L2":"With the addition of the jumpboard, this class fuses plyometric cardio with Pilates precision to build stamina, endurance and full-body control. Designed for intermediate-level clients with a strong understanding of Pilates principles and the Reformer machine, you’ll progress into faster-paced, athletic sequences that challenge strength, coordination and core stability. We recommend having taken at least 10 Reformer classes before trying Power Reformer L3. Please note: not suitable for beginners, pre/post-natal clients, or those with significant injuries.","BLOKSTRENGTH: FULL BODY":"Build muscular strength and endurance from head-to-toe on our full body days. Each session in the week will vary between strength, hypertrophy and endurance training to help build muscles conditioned to whatever life throws at it. Using a mix of dumbbells, kettlebells, bodyweight and other accessory equipment you will be challenged through your full range of movement, unilaterally and across all planes of movement.","CALISTHENICS":"Discover the strength-based challenge of calisthenics, utilising your bodyweight to create unique and challenging workouts. Suitable for beginners and experienced practitioners, these classes develop upper body strength, endurance, and core strength that could rival a gymnast.","BLOKFIT":"Improve your overall fitness with BLOKfit, a dynamic full-body circuit class combining strength and cardio. Working in timed intervals with little or no rest between stations, you'll target each muscle group using a range of equipment from free weights, battle ropes, slam balls and more. BLOKfit will improve your cardiovascular endurance, strength, power, speed and agility.","BLOKSTRENGTH: LOWER BODY":"Build strength and endurance in your squat, deadlift, and lunge. This structured lower body session uses free weights, boxes and bodyweight to improve technique, balance muscle growth and support joint health. Strengthen key movement patterns, reduce injury risk and challenge both major and stabilising muscles to enhance your lower body performance and muscular control.","BLOKSTRENGTH: UPPER BODY":"Strengthen your shoulders, arms, chest and back with structured programming and progressive training. This session focuses on lifting technique, upper body strength and endurance. Using free weights, bodyweight and varied equipment, you’ll isolate, stabilise and challenge muscles to improve control, size and performance while building a strong, well-balanced upper body from every angle.","HOT + COLD QUIET":"Quiet sessions at Hot + Cold offer a more introspective take on our signature contrast therapy experience. With minimal distractions and a focus on stillness, this is your invitation you to slow down, regulate your nervous system and reconnect with your inner rhythm. Rooted in ancient sauna and cold-water traditions, and shaped by a modern, integrative approach, each session is designed to build resilience, support recovery and create space for presence.","BLOKPOWER":"BLOKpower is a high-intensity class that builds explosive strength, sharpens speed and challenges your body to go all in. Combining power-driven plyometrics and active strength recovery, this session targets your top performance zone. Expect high-impact sets, explosive movements and real sweat. All levels welcome.","YIN YOGA":"Quiet the mind in this contemplative practice blending Traditional Chinese Medicine with Eastern Philosophy. Long-held, passive yoga postures target deep connective tissue, improving joint mobility and stimulating meridian lines. Experience the deep release tension, allowing energy to flow freely.","BOXCON":"Boxcon is a fun, fast-paced class, combining bag sequences, bodyweight drills and resistance exercises to push you to your limits. Mixing training techniques from the world's best boxers with traditional strength & conditioning exercises, Boxcon will improve your fitness, boxing technique and cognitive skills.Suitable for beginners and experienced boxers alike. \n\nHand wraps are strongly advised and available to be purchased at reception for £5. We advise customers to bring their own gloves if possible, however we also provide gloves in-class. Boxing gloves are also available to be purchased at reception for £55.","BLOKMOBILITY":"BLOKmobility is our signature class for improving the way you move. Using a mix of resistance, bodyweight and weighted exercises, you’ll build strength, flexibility and control while increasing your range of movement. Each month you’ll work towards a specific mobility skill like front splits or single leg squats through structured progressions that combine targeted strength work and drills to support how you move across the rest of the training schedule and in everyday life.","BLOKCORE":"A strong core sets you up for life, and makes every class that bit easier. Designed to keep core training interesting, BLOKcore goes beyond crunches to improve core and lower body strength. Using weights, TRX suspension training, and bodyweight exercises, (including mountain climbers, pikes and leg raises), BLOKcore will help you achieve the core strength you've always wanted, challenging your body in exciting new ways.","HANDSTANDS":"Find progression with Handstands. True to the BLOK ethos, these skill-based classes will set you new challenges and reward dedication and perseverance. Working from the foundations up, these classes focus on drills and exercises to build the strength and flexibility required for the perfect handstand. No prior experience required.","YOGA WITH MEDITATION":"Create space in your day for a moment of peace in the mind. Combining calming breathwork with physical yoga practice, this grounding practice releases tension from the body, quietens the mind, and prepares you for an extended guided meditation.","BLOKBREATH":"Explore powerful breathing techniques that regulate the nervous system, alleviate physical tension and enhance your resilience in handling daily stressors. Engage in rhythmic circular breathing patterns to access deep meditative states and promote rest and recovery. This class is not suitable if you are pregnant. Please contact your physician if you have any of the following conditions: history of heart disease/cardiovascular issues, history of seizures, high blood pressure.","BLOKSOUND":"Activate calming theta brainwave frequencies, release tension and create space for peaceful self-reflection using the healing influence of sound. Our instructors work with a variety of instruments from quartz crystal or Tiebetan bowls, to harmonious gongs for a unique and restorative sensory journey.","HOT + COLD GUIDED: Recover":"Designed to support peak performance and post-training integration. RECOVER focuses on circulation, mobility and gentle nervous system down-regulation to help muscles and joints repair after strength or high-impact training. Guided rounds of sauna and cold immersion are paired with mobility drills, breathwork and contrast-focused sequencing to create an optimal internal recovery state. Leave feeling rebalanced, supple and restored.","SMALL GROUP PT: LOWER BODY":"Small Group PT is a structured strength programme, delivered in a group of six. Lower Body sessions cover the push and pull movements that build a strong foundation - squats, deadlifts, lunges and key accessory work. Your trainer adapts every session to your ability and goals, recording your weights each session so the programme keeps moving you forward. Ideal if you're ready to train with real focus and structure, and see what consistent, coached progression can do. New to Open Gym? We recommend completing a complimentary Intro to Open Gym session first.","SMALL GROUP PT: UPPER BODY":"Small Group PT is a structured strength programme, delivered in a group of six. Upper Body sessions cover the push, pull and carry movements that build a strong, capable upper body - bench press, row, overhead press, cable and isolation work. Your trainer adapts every session to your ability and goals, recording your weights each session so the programme keeps moving you forward. Ideal if you're ready to train with real focus and structure, and see what consistent, coached progression can do. New to Open Gym? We recommend completing a complimentary Intro to Open Gym session first.","HOT + COLD GUIDED: Unwind":"A soothing contrast therapy experience to help you slow down, soften and let go. UNWIND weaves breath-led movement, restorative heat and gentle cold immersion into a guided flow designed to shift you into deep parasympathetic rest. Ideal for evening or end-of-day restoration, this session uses soft breathwork, meditative pacing and calming sensory inputs to bring your body back into balance. Expect to leave feeling grounded, nourished and deeply relaxed.","SMALL GROUP PT: FULL BODY":"Small Group PT is a structured strength programme, delivered in a group of six. Full Body sessions combine lower and upper body work in a single session giving you a complete strength workout covering functional movement and balanced muscular strength. Your trainer adapts every session to your ability and goals, recording your weights each session so the programme keeps moving you forward. Ideal if you're ready to train with real focus and structure, and see what consistent, coached progression can do. New to Open Gym? We recommend completing a complimentary Intro to Open Gym session first.","YIN YANG FLOW":"Find space and strength in this balanced yoga practice. Engage in dynamic Yang-style moving meditation emphasising muscularity and conscious breath connection. Soften into relaxation by incorporating extended release work with Yin, promoting improved mental clarity and mobility.","HOT + COLD GUIDED: Energise":"The perfect pick-me-up for body and mind. ENERGISE blends the ancient practices of sauna and cold water therapy with breathwork and embodied movement to sharpen focus, uplift mood and unlock flow. Guided by an instructor, this session includes energising breathwork, task-based mindfulness and sensory tools designed to help you shift gears and reignite creativity. Expect a bright, dopamine-boosting session to leave you clear, focused and mentally recharged."},STUDIO_URL={"Clapton":"https://classpass.com/studios/blok-clapton-london","Shoreditch":"https://classpass.com/studios/blok-shoreditch-london"},LOCS=[];

 document.addEventListener('mouseover',function(e){var el=pill(e);if(el)show(el,e.clientX,e.clientY);else if(cur)hide();});
 document.addEventListener('mousemove',function(e){var el=pill(e);if(cur&&el===cur)show(cur,e.clientX,e.clientY);});
 document.addEventListener('focusin',function(e){var el=pill(e);if(el){var r=el.getBoundingClientRect();show(el,r.left,r.bottom-8);}});
 document.addEventListener('focusout',hide);
 // Don't hide on scroll: the pointer is usually still over the pill (trackpad
 // scrolling, or a programmatic scrollIntoView), and hiding leaves the tooltip
 // stuck off until the mouse moves. Reposition to the element instead.
 document.addEventListener('scroll',function(){
  if(!cur)return;
  if(!document.body.contains(cur)){hide();return;}
  var r=cur.getBoundingClientRect();
  if(r.bottom<0||r.top>window.innerHeight){hide();return;}
  show(cur,r.left,r.bottom-8);
 },true);
 document.addEventListener('keydown',function(e){if(e.key==='Escape')hide();});
})();
function draw(){
 var tb=document.getElementById('tb');tb.innerHTML='';DSHOWN=[];setTimeout(paintDays,0);
 var cur='',shown=0,cnt={};
 D.forEach(function(r){
  if(LOCS.length&&!LOCON[r[6]])return;      // location switched off
  var sel=SEL[r[10]];
  if(sel.indexOf(r[4])<0)return;
  // A class you have BOOKED is never hidden by the convenience
  // toggles. 'Bookable now only' means 'nothing I cannot take' - and
  // a booked class is not bookable, so it vanished from the schedule,
  // which reads as 'my bookings are missing'. Unticking a class type
  // still hides it: that one is a deliberate choice about content.
  var mine=r[7]==='booked';
  if(!mine){
   if(av.checked&&r[7]!=='bookable')return;
   if(hf.checked&&r[7]==='full')return;
   if(hw.checked&&r[9]<5&&r[1]>=480&&r[1]<=1035)return;
  }
  cnt[r[7]]=(cnt[r[7]]||0)+1;shown++;
  cur=addRow(tb,r,cur);
 });
 document.getElementById('none').style.display=shown?'none':'block';
 document.getElementById('shown').textContent=shown+' of '+D.length+' shown';
 var ms=document.getElementById('mshown');if(ms)ms.textContent=shown+' of '+D.length+' shown';
 var lab=[['bookable','Bookable'],['full','Full'],['soon','Not yet open'],['booked','Booked'],['closed','Closed'],['unknown','Status unknown'],['open','In the timetable']];
 var lg=document.getElementById('lg');lg.innerHTML='';
 lab.forEach(function(p){
  if(!cnt[p[0]])return;
  var e=document.createElement('span');
  e.innerHTML='<i style="background:'+SC[p[0]]+'"></i>'+p[1]+' <b>'+cnt[p[0]]+'</b>';
  lg.appendChild(e);
 });
}

// The filters were sticky, so they held the top of the window all the way down
// a 2000-row schedule. Let them scroll away like anything else, and leave a
// slim strip in their place that expands over the page when you need them.
(function(){
 var bar=document.getElementById('filters'),mb=document.getElementById('minibar'),
     mbt=document.getElementById('mbt'),mbc=document.getElementById('mbc'),
     fs=document.getElementById('fscrim'),mq=window.matchMedia('(max-width:640px)');
 if(!bar||!mb)return;
 function open(){return bar.classList.contains('float')}
 function float(on){
  bar.classList.toggle('float',on);
  bar.style.top=on?(mb.offsetHeight+'px'):'';
  fs.classList.toggle('on',on);
  mbt.setAttribute('aria-expanded',on?'true':'false');
  mbc.textContent=on?'\u25b4':'\u25be';
  if(on)mb.classList.add('on');
 }
 function update(){
  if(mq.matches){float(false);mb.classList.remove('on');return;}   // phones use the hamburger
  if(open()){mb.classList.add('on');return;}
  mb.classList.toggle('on', bar.getBoundingClientRect().bottom<=0);
 }
 mbt.addEventListener('click',function(){float(!open())});
 fs.addEventListener('click',function(){float(false)});
 document.addEventListener('keydown',function(e){if(e.key==='Escape'&&open())float(false)});
 window.addEventListener('scroll',update,{passive:true});
 window.addEventListener('resize',update);
 update();
})();
// Mobile: one hamburger holds everything that is not the schedule itself.
// The controls are MOVED, not duplicated - a second copy of a checkbox is a
// second source of truth, and they drift. Every listener above still applies
// because these are the same nodes.
(function(){
 var mq=window.matchMedia('(max-width:640px)');
 var drawer=document.getElementById('drawer'),scrim=document.getElementById('scrim'),
     dbody=document.getElementById('dbody'),btn=document.getElementById('mnu'),
     dclose=document.getElementById('dclose');
 if(!drawer||!btn)return;
 var blocks=['.sub','#lg','#booked','.bar'].map(function(sel){
  var el=document.querySelector(sel);
  return el?{el:el,parent:el.parentNode,next:el.nextSibling}:null;
 }).filter(Boolean);
 var inMenu=false;
 function toMenu(){if(inMenu)return;blocks.forEach(function(b){dbody.appendChild(b.el)});inMenu=true;}
 function toPage(){if(!inMenu)return;blocks.forEach(function(b){b.parent.insertBefore(b.el,b.next)});inMenu=false;}
 function show(on){
  drawer.classList.toggle('open',on);scrim.classList.toggle('on',on);
  btn.setAttribute('aria-expanded',on?'true':'false');
  document.body.classList.toggle('locked',on);
 }
 function apply(){ if(mq.matches){toMenu();} else {show(false);toPage();} }
 btn.addEventListener('click',function(){show(!drawer.classList.contains('open'))});
 scrim.addEventListener('click',function(){show(false)});
 dclose.addEventListener('click',function(){show(false)});
 document.addEventListener('keydown',function(e){if(e.key==='Escape')show(false)});
 if(mq.addEventListener)mq.addEventListener('change',apply);else if(mq.addListener)mq.addListener(apply);
 apply();
})();
// Jump links: the M T W ... strip and each booked class scroll the schedule
// to that day / that class, clear of whatever header is stuck to the top.
var DSHOWN;
function jumpTo(el){
 if(!el)return false;
 var dr=document.getElementById('drawer');
 if(dr&&dr.classList.contains('open')){var c=document.getElementById('dclose');if(c)c.click();}
 var off=6,tp=document.getElementById('topbar'),mb=document.getElementById('minibar');
 if(tp&&getComputedStyle(tp).display!=='none')off+=tp.offsetHeight;
 else if(mb){var was=mb.classList.contains('on');mb.classList.add('on');off+=mb.offsetHeight;if(!was)mb.classList.remove('on');}
 // Instant, then one correction: the sticky filter strip appears once the
 // filters scroll away and shifts the table by its own height, so a single
 // (or smooth) scroll lands a strip-height off. The yellow flash marks it.
 window.scrollTo(0,Math.max(0,el.getBoundingClientRect().top+window.pageYOffset-off));
 var fix=function(){var dy=el.getBoundingClientRect().top-off;if(Math.abs(dy)>2)window.scrollBy(0,dy)};
 requestAnimationFrame(function(){requestAnimationFrame(fix)});setTimeout(fix,120);
 el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit');
 setTimeout(function(){el.classList.remove('hit')},1800);
 return true;
}
function paintDays(){
 var n=new Date(),p=function(x){return (x<10?'0':'')+x};
 var today=n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate()),bkd={};
 D.forEach(function(r){if(r[7]==='booked')bkd[r[0]]=1});
 var h='';
 (DSHOWN||[]).forEach(function(iso,i){
  var d=new Date(iso+'T00:00:00'),c=[];
  if(i&&d.getDay()===1)c.push('wk');
  if(iso===today)c.push('today');
  if(bkd[iso])c.push('bk');
  h+='<a href="#d-'+iso+'" data-d="'+iso+'" class="'+c.join(' ')+'" title="'+dl(iso)+(bkd[iso]?' — you have a booking':'')+'">'
   +'<span>'+'MTWTFSS'.charAt((d.getDay()+6)%7)+'</span><b>'+d.getDate()+'</b></a>';
 });
 [].forEach.call(document.querySelectorAll('.dnav'),function(nv){nv.innerHTML=h});
}
document.addEventListener('click',function(e){
 var t=e.target;if(!t||!t.closest)return;
 var a=t.closest('.dnav a');
 if(a){e.preventDefault();jumpTo(document.getElementById('d-'+a.getAttribute('data-d')));return;}
 var b=t.closest('#booked a.bgo');
 if(b){
  e.preventDefault();
  var k=b.getAttribute('data-k'),row=null;
  [].some.call(document.querySelectorAll('#tb tr[data-k]'),function(tr){if(tr.getAttribute('data-k')===k){row=tr;return true}return false});
  if(!jumpTo(row)){
   var note=b.querySelector('.bh');
   if(!note){note=document.createElement('span');note.className='bh';b.appendChild(note)}
   note.textContent='hidden by your filters';
   setTimeout(function(){note.textContent=''},2500);
  }
 }
});
